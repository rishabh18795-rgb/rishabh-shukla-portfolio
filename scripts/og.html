<!doctype html><html><head><meta charset="utf-8">
<!-- Source for public/og.png. Render at 1200x630. -->
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}body{width:1200px;height:630px;background:#06080b;color:#f2f5f7;font-family:'Inter Tight';position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(to right,rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(to bottom,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(ellipse 80% 80% at 30% 20%,#000 30%,transparent 100%)}
.glow{position:absolute;width:900px;height:600px;left:-200px;top:-300px;background:radial-gradient(closest-side,rgba(63,224,255,.22),transparent)}
.wrap{position:relative;padding:72px 80px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top{display:flex;align-items:center;gap:16px;font-family:'JetBrains Mono';font-size:18px;color:#3fe0ff;letter-spacing:.18em;text-transform:uppercase}
.mono{width:56px;height:56px;border:2px solid rgba(63,224,255,.55);border-radius:14px;display:grid;place-items:center;font-family:'Instrument Serif';font-style:italic;font-size:28px;color:#f2f5f7;letter-spacing:0;text-transform:none}
h1{font-weight:500;font-size:78px;line-height:1;letter-spacing:-.035em;max-width:820px}
em{font-family:'Instrument Serif';font-weight:400}.c{color:#3fe0ff}
.bot{font-size:22px;color:#8d98a5}.bot b{color:#f2f5f7;font-weight:500;font-size:30px;display:block;margin-bottom:6px}
</style></head><body><div class="grid"></div><div class="glow"></div>
<div class="wrap"><div class="top"><span class="mono">RS</span>Strategy &amp; Operations Lead</div>
<h1 style="font-size:132px;letter-spacing:-.045em;line-height:.92">Rishabh <em>Shukla</em></h1>
<div class="bot"><b>Business Strategy <span class="c">|</span> Growth <span class="c">|</span> Product Operations</b>Strategy, operations, technology and go-to-market execution.</div></div></body></html>
